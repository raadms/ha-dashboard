<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Safrani Home · Sign In</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090f;--text:#f1f5f9;--muted:#64748b;--muted2:#94a3b8;--blue:#5b8dee;--r:20px;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 85% 55% at 5% -10%,rgba(91,141,238,.55),transparent 48%),
    radial-gradient(ellipse 70% 55% at 97% 105%,rgba(167,139,250,.50),transparent 50%),
    radial-gradient(ellipse 50% 45% at 52% 58%,rgba(16,185,129,.18),transparent 48%);}
.wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  border-radius:28px;padding:36px 32px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 32px 64px rgba(0,0,0,.5);}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,rgba(91,141,238,.35),rgba(91,141,238,.15));
  border:1px solid rgba(91,141,238,.3);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px;}
h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:6px}
.sub{text-align:center;font-size:13px;color:var(--muted2);margin-bottom:28px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--muted2);text-transform:uppercase;margin-bottom:8px}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;
  padding:14px 16px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
input:focus{border-color:rgba(91,141,238,.6)}
input::placeholder{color:var(--muted)}
.field{margin-bottom:16px}
.btn{width:100%;padding:15px;border-radius:16px;border:none;cursor:pointer;font-size:15px;font-weight:700;
  font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;margin-top:4px;}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled{opacity:.4;cursor:default}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:12px;
  padding:12px 14px;font-size:13px;color:#fca5a5;margin-top:12px;display:none;}
.err.show{display:block}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;display:none}
.spinner.show{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.dur-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.dur-pill{padding:10px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);cursor:pointer;font-size:12px;font-weight:600;
  color:var(--muted2);text-align:center;transition:all .15s;}
.dur-pill:hover{background:rgba(255,255,255,.10);color:var(--text);}
.dur-pill.sel{background:rgba(91,141,238,.22);border-color:rgba(91,141,238,.5);color:#93c5fd;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">🏠</div>
    <h1 id="title">Safrani Home</h1>
    <p class="sub" id="subtitle">Sign in to continue</p>

    <div class="field">
      <label>Username</label>
      <input type="text" id="uname" placeholder="Enter your username" autocomplete="username"
             onkeydown="if(event.key==='Enter')document.getElementById('pwd').focus()"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwd" placeholder="Enter your password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>

    <div class="field">
      <label>Stay signed in for</label>
      <div class="dur-grid">
        <div class="dur-pill" data-dur="5m"    onclick="selDur(this)">5 min</div>
        <div class="dur-pill" data-dur="1h"    onclick="selDur(this)">1 hour</div>
        <div class="dur-pill" data-dur="24h"   onclick="selDur(this)">24 hours</div>
        <div class="dur-pill" data-dur="7d"    onclick="selDur(this)">7 days</div>
        <div class="dur-pill sel" data-dur="30d" onclick="selDur(this)">30 days</div>
        <div class="dur-pill" data-dur="never" onclick="selDur(this)">Never</div>
      </div>
    </div>

    <div class="err" id="login-err"></div>
    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
      <span class="spinner" id="login-spin"></span>
      <span id="login-txt">Sign In</span>
    </button>
  </div>
</div>

<script>
let _selDur = '30d';
function selDur(el) {
  document.querySelectorAll('.dur-pill').forEach(p => p.classList.remove('sel'));
  el.classList.add('sel');
  _selDur = el.dataset.dur;
}

async function doLogin() {
  const err  = document.getElementById('login-err');
  err.classList.remove('show');
  const uname = document.getElementById('uname').value.trim();
  const pwd   = document.getElementById('pwd').value;
  if (!uname) { err.textContent = 'Please enter your username'; err.classList.add('show'); return; }
  if (!pwd)   { err.textContent = 'Please enter your password'; err.classList.add('show'); return; }

  const btn  = document.getElementById('login-btn');
  const spin = document.getElementById('login-spin');
  const txt  = document.getElementById('login-txt');
  btn.disabled = true; spin.classList.add('show'); txt.textContent = 'Signing in…';

  try {
    const res  = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: uname, password: pwd, duration: _selDur })
    });
    const data = await res.json();
    if (data.token) {
      sessionStorage.setItem('ha_dash_token', data.token);
      window.location.href = '/';
    } else {
      err.textContent = data.error || 'Invalid credentials';
      err.classList.add('show');
    }
  } catch {
    err.textContent = 'Could not reach server';
    err.classList.add('show');
  } finally {
    btn.disabled = false; spin.classList.remove('show'); txt.textContent = 'Sign In';
  }
}

// Redirect if already signed in
if (sessionStorage.getItem('ha_dash_token')) window.location.href = '/';
// Load dashboard name
fetch('/api/config').then(r => r.json()).then(d => {
  if (d.name) document.getElementById('title').textContent = d.name;
}).catch(() => {});
</script>
</body>
</html>
